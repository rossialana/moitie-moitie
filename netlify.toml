# Netlify détecte Next.js tout seul ; ce fichier fixe juste la commande et la version de Node.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Runtime Next.js de Netlify (pages, API /api/push/send). Indispensable : sans lui, .next est servi tel quel (404).
[[plugins]]
  package = "@netlify/plugin-nextjs"
